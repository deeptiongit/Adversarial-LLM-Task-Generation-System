# Adversarial LLM Task Generation System Configuration

# API Keys (can be overridden by environment variables)
api_keys:
  openai: ${OPENAI_API_KEY}
  anthropic: ${ANTHROPIC_API_KEY}

# LLM Configuration
llm:
  default_provider: "openai"
  default_model: "gpt-4"
  temperature: 0.0
  max_tokens: 2000
  timeout: 60
  max_retries: 3
  retry_delay: 2

# Available Models
models:
  openai:
    - "gpt-4"
    - "gpt-4-turbo"
    - "gpt-3.5-turbo"
  anthropic:
    - "claude-3-opus-20240229"
    - "claude-3-sonnet-20240229"
    - "claude-3-haiku-20240307"

# Problem Generation
problem_generation:
  domains:
    - "number_theory"
    - "game_theory"
  templates_per_domain: 10
  
# Mutation Configuration
mutation:
  types:
    - "constraint"
    - "instruction"
    - "composition"
    - "adversarial_trap"
  max_mutations_per_problem: 5
  discard_on_ground_truth_failure: true

# Search Optimization
search:
  strategies:
    - "random"
    - "evolutionary"
    - "hill_climbing"
  random_seed: 42
  max_iterations: 100
  population_size: 20  # for evolutionary
  mutation_rate: 0.3
  crossover_rate: 0.7
  batch_size: 5
  
# Logging
logging:
  level: "INFO"
  log_dir: "logs"
  save_raw_responses: true
  save_prompts: true
  
# Visualization
visualization:
  output_dir: "visualizations"
  formats:
    - "png"
    - "html"
  dpi: 300
